# Start:   docker compose up -d --build
# Stop:    docker compose stop        (data is kept in the keel-data volume)
# Logs:    docker compose logs -f
# Backup:  docker compose exec keel npm run backup   then   docker cp keel:/data/backups ./backups
#
# Reads ENCRYPTION_KEY (and optionally APP_URL, SECURE_COOKIES, ALLOW_OPEN_SIGNUP) from the .env file next to this file.
services:
  keel:
    build: .
    image: keel
    container_name: keel
    restart: unless-stopped
    ports:
      - "3000:3000"
    environment:
      ENCRYPTION_KEY: "${ENCRYPTION_KEY:?Set ENCRYPTION_KEY in .env first (npm run setup)}"
      APP_URL: ${APP_URL:-}
      SECURE_COOKIES: ${SECURE_COOKIES:-false}
      ALLOW_OPEN_SIGNUP: ${ALLOW_OPEN_SIGNUP:-false}
    volumes:
      - keel-data:/data

volumes:
  keel-data:
    name: keel-data
